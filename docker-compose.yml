services:
  db:
    image: postgres:16-alpine
    container_name: rsud-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: rsud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsud_secret}
      POSTGRES_DB: rsud
    ports:
      - "${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsud"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - rsud-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rsud-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://rsud:${POSTGRES_PASSWORD:-rsud_secret}@db:5432/rsud
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE:-15}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE:-7}"
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8100}:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - rsud-net

  frontend:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: rsud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - rsud-net

volumes:
  pgdata:
    name: rsud-pgdata
  uploads:
    name: rsud-uploads

networks:
  rsud-net:
    name: rsud-network
    driver: bridge
