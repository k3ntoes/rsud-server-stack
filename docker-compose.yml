services:
  db:
    image: postgres:16-alpine
    container_name: rsud-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: rsud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsud_secret}
      POSTGRES_DB: rsud
    ports:
      - "${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsud"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - rsud-net

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: rsud-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/pgadmin-entrypoint.sh"]
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/entrypoint.sh:/usr/local/bin/pgadmin-entrypoint.sh:ro
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rsud.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-rsud_admin}
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      # .local is a special-use domain (mDNS); pgAdmin rejects it unless allowed
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rsud_secret}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - rsud-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rsud-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://rsud:${POSTGRES_PASSWORD:-rsud_secret}@db:5432/rsud
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE:-15}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE:-7}"
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8100}:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - rsud-net

  frontend:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: rsud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - rsud-net

  # Background worker — processes outbox jobs (recalculate_analytics,
  # generate_thumbnail) created by the API on approval/photo upload.
  # Without this service, approved inspections never update analytics.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rsud-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://rsud:${POSTGRES_PASSWORD:-rsud_secret}@db:5432/rsud
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE:-15}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE:-7}"
      UPLOAD_DIR: /app/uploads
      # PENDING jobs older than this mark the worker unhealthy (default 5 min)
      WORKER_HEALTH_STALE_MINUTES: "${WORKER_HEALTH_STALE_MINUTES:-5}"
    command: ["python", "-m", "app.modules.background.worker"]
    healthcheck:
      # Healthcheck exec bypasses the entrypoint, so use the venv python directly
      # (skips migrations/seed; probes only background_jobs for stale PENDING jobs)
      test: ["CMD", "/app/.venv/bin/python", "-m", "app.modules.background.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - rsud-net

volumes:
  pgdata:
    name: rsud-pgdata
  uploads:
    name: rsud-uploads
  pgadmin:
    name: rsud-pgadmin

networks:
  rsud-net:
    name: rsud-network
    driver: bridge
